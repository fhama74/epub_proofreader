[project]
name = "epub-proofreader"
version = "0.5.8"
description = "Structure-preserving Japanese EPUB proofreader, Phase 5 PDF text following"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "lxml>=5.3,<7", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1", "cryptography>=45,<48", "tinycss2>=1.4,<2", "cssselect2>=0.8,<1"]
[dependency-groups]
dev = ["pytest>=8,<10", "pillow>=11,<13"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
