name: Publish GHCR image
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: ghcr-publication
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/fhama74/epub_proofreader
  SOURCE_RELEASE: container-${{ github.sha }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync --locked && uv run pytest -q
      - name: Prepare corresponding-source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$SOURCE_RELEASE" > /dev/null 2>&1; then
            gh release create "$SOURCE_RELEASE" --target "$GITHUB_SHA" --draft --title "Container sources ${GITHUB_SHA:0:12}" --notes-file docs/CONTAINER_SOURCES.md
          fi
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      EPROOF_IMAGE: local/epub-proofreader:publication
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the native image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.EPROOF_IMAGE }}
          build-args: APP_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=ghcr-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ matrix.arch }}
      - name: Test image-only setup, PDF assets and EPUBCheck
        run: |
          docker compose -f compose.ghcr.yaml up -d --wait --wait-timeout 120
          python3 scripts/docker_smoke.py --state /tmp/eproof-ghcr-smoke.json --create
          sudo sha256sum secrets/ai_secret_key > /tmp/key.sha256
          docker compose -f compose.ghcr.yaml down
          docker compose -f compose.ghcr.yaml up -d --wait --wait-timeout 120
          sudo sha256sum --check /tmp/key.sha256
          python3 scripts/docker_smoke.py --state /tmp/eproof-ghcr-smoke.json
      - name: Collect matching sources and notices
        run: |
          mkdir -p container-sources
          docker run --rm --entrypoint .venv/bin/python -v "$PWD/scripts/collect_container_sources.py:/collect.py:ro" -v "$PWD/container-sources:/sources" "$EPROOF_IMAGE" /collect.py --output /sources
          sudo tar -czf "container-sources-${{ matrix.arch }}.tar.gz" -C container-sources .
          sha256sum "container-sources-${{ matrix.arch }}.tar.gz" > "container-sources-${{ matrix.arch }}.sha256"
      - name: Upload source archive before publishing the binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$SOURCE_RELEASE" "container-sources-${{ matrix.arch }}.tar.gz" "container-sources-${{ matrix.arch }}.sha256" --clobber
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested image
        run: |
          docker tag "$EPROOF_IMAGE" "$IMAGE:sha-$GITHUB_SHA-${{ matrix.arch }}"
          docker push "$IMAGE:sha-$GITHUB_SHA-${{ matrix.arch }}"
      - name: Container logs
        if: failure()
        run: docker compose -f compose.ghcr.yaml logs --no-color --tail 100
      - name: Stop test containers
        if: always()
        run: docker compose -f compose.ghcr.yaml down
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Make matching source archives available
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$SOURCE_RELEASE" --draft=false --latest=false
      - name: Publish multi-platform tags
        run: |
          tags=(--tag "$IMAGE:latest" --tag "$IMAGE:sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tags+=(--tag "$IMAGE:${GITHUB_REF_NAME#v}")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:sha-$GITHUB_SHA-amd64" "$IMAGE:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA"
      - name: Pull published image and recheck operation
        env:
          EPROOF_IMAGE: ghcr.io/fhama74/epub_proofreader:sha-${{ github.sha }}
        run: |
          docker compose -f compose.ghcr.yaml pull
          docker compose -f compose.ghcr.yaml up -d --wait --wait-timeout 120
          python3 scripts/docker_smoke.py --state /tmp/eproof-published.json --create
      - name: Stop verification containers
        if: always()
        run: docker compose -f compose.ghcr.yaml down
