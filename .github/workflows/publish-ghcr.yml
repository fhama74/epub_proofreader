name: Preserve published v0.1 baseline
on:
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: preserve-v01-baseline
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/fhama74/epub_proofreader
  SOURCE_SHA: 06101a6c5610428ae48f2880adbba20a02f94058
  IMAGE_DIGEST: sha256:6f069537bf4f7cca525d54021ebea917af6b8d8a56b691ec39e726147d0d4639
  GH_TOKEN: ${{ github.token }}
  GH_REPO: fhama74/epub_proofreader
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Preserve the existing multi-platform image without rebuilding
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:0.1" >/dev/null 2>&1; then
            existing=$(docker buildx imagetools inspect "$IMAGE:0.1" --format '{{.Manifest.Digest}}')
            test "$existing" = "$IMAGE_DIGEST"
          else
            docker buildx imagetools create --tag "$IMAGE:0.1" "$IMAGE@$IMAGE_DIGEST"
          fi
          actual=$(docker buildx imagetools inspect "$IMAGE:0.1" --format '{{.Manifest.Digest}}')
          test "$actual" = "$IMAGE_DIGEST"
          docker buildx imagetools inspect "$IMAGE:0.1"
      - name: Prepare pinned Compose and baseline record
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,datetime
          from pathlib import Path
          sha=os.environ['SOURCE_SHA'];image=os.environ['IMAGE'];digest=os.environ['IMAGE_DIGEST']
          with urllib.request.urlopen(f'https://raw.githubusercontent.com/fhama74/epub_proofreader/{sha}/compose.ghcr.yaml') as r:compose=r.read().decode()
          assert compose.count(image+':latest')==2
          Path('compose.v0.1.yaml').write_text(compose.replace(image+':latest',image+'@'+digest))
          record=dict(version='0.1',source_commit=sha,image=image+':0.1',image_digest=digest,platforms=['linux/amd64','linux/arm64'],preserved_at=datetime.datetime.now(datetime.timezone.utc).isoformat(),component_sources=f'https://github.com/fhama74/epub_proofreader/releases/tag/container-{sha}')
          Path('baseline-v0.1.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          cat > release-notes.md <<'NOTES'
          性能比較用に、2026年10月19日時点の公開版を0.1として固定しました。

          - ソース: `06101a6c5610428ae48f2880adbba20a02f94058`
          - Docker: `ghcr.io/fhama74/epub_proofreader:0.1`
          - 固定イメージ: `ghcr.io/fhama74/epub_proofreader@sha256:6f069537bf4f7cca525d54021ebea917af6b8d8a56b691ec39e726147d0d4639`
          - 対応: linux/amd64、linux/arm64
          - 既存イメージをそのまま保存しています。再ビルドはしていません。
          - 直近のローカル開発中のDB管理・校正進捗などの変更は含みません。アプリ内部の旧バージョン表示はそのままです。

          空の専用フォルダーで次を実行すると、この版を起動できます。

          ```sh
          curl -fL https://github.com/fhama74/epub_proofreader/releases/download/v0.1/compose.v0.1.yaml -o compose.yaml
          docker compose pull
          docker compose up -d
          ```

          添付Composeはイメージのダイジェストを固定しています。比較時は別の保存先とポートを使い、同じEPUB・AIモデル・プロンプト・検査範囲・校閲状態で実施してください。

          [同梱コンポーネントの対応ソースとライセンス情報](https://github.com/fhama74/epub_proofreader/releases/tag/container-06101a6c5610428ae48f2880adbba20a02f94058)
          NOTES
      - name: Publish the matching source release and pinned assets
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/git/ref/tags/v0.1" >/dev/null 2>&1; then
            test "$(gh api "repos/$GH_REPO/git/ref/tags/v0.1" --jq .object.sha)" = "$SOURCE_SHA"
          else
            gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/v0.1 -f sha="$SOURCE_SHA"
          fi
          if ! gh release view v0.1 >/dev/null 2>&1; then
            gh release create v0.1 --verify-tag --draft --title 'EPUB Proofreader 0.1' --notes-file release-notes.md
          fi
          gh release upload v0.1 compose.v0.1.yaml baseline-v0.1.json --clobber
          gh release edit v0.1 --draft=false --latest=true
